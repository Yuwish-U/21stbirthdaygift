<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>礼物清单</title>
    <style>
        /* 全局与基础设定 */
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* 强制横屏提示 */
        #rotate-notice {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111;
            color: #fff;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
            flex-direction: column;
        }
        @media (orientation: portrait) {
            #rotate-notice { display: flex; }
        }

        /* 16:9 容器 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            margin: auto;
            overflow: hidden;
            background-color: #000;
        }

        /* 黑白漫画风滤镜 */
        .comic-filter {
            filter: grayscale(100%) contrast(130%) brightness(95%);
        }

        /* 图片高亮效果 */
        .img-highlight {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            border-radius: 4px;
        }

        /* 全屏背景图片 */
        .bg-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* 各界面层级 */
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: none;
            transition: opacity 0.5s ease;
        }
        .screen.active {
            display: block;
        }

        /* 星星特效 */
        .star-effect {
            position: absolute;
            color: #fff;
            font-size: 24px;
            pointer-events: none;
            z-index: 9999;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 5px #fff;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; }
        }

        /* 交互热区 */
        .hotspot {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            /* background: rgba(255,0,0,0.3); 调试时取消注释 */
        }

        /* 抽屉物品不规则摆放 */
        .drawer-item {
            position: absolute;
            z-index: 15;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .drawer-item:hover {
            transform: scale(1.05);
        }

        /* 物品大图展示居中 */
        .item-display {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            max-width: 60%; max-height: 70%;
            z-index: 30;
            cursor: pointer;
            display: none;
        }

        /* ================= 写实风手机 UI ================= */
        #phone-modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 650px;
            background: #000;
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 5px rgba(255,255,255,0.3);
            z-index: 100;
            display: none;
            padding: 10px;
            border: 2px solid #555;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #f2f2f7;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .phone-status-bar {
            height: 30px;
            background: #f2f2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: bold;
            color: #000;
            z-index: 10;
        }

        .phone-home-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="%23e0e0e0"/></svg>') no-repeat center center;
            background-size: cover;
        }

        .wechat-icon {
            width: 70px; height: 70px;
            background: #07c160;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .wechat-icon::after {
            content: "💬";
            font-size: 40px;
        }

        /* 聊天界面 */
        .chat-ui {
            flex: 1;
            display: none;
            flex-direction: column;
            background: #ededed;
            height: 100%;
        }

        .chat-header {
            height: 50px;
            background: #f2f2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
            font-weight: bold;
            color: #000;
            position: relative;
        }

        .chat-header .back-btn {
            position: absolute;
            left: 15px;
            font-size: 20px;
            cursor: pointer;
        }

        .chat-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
        }

        .msg-row.right {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px; height: 40px;
            border-radius: 4px;
            background: #ccc;
            flex-shrink: 0;
            object-fit: cover;
        }

        .msg-bubble {
            max-width: 70%;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-all;
            color: #000;
            position: relative;
        }

        .msg-bubble.left { background: #fff; }
        .msg-bubble.left::before {
            content: ''; position: absolute;
            left: -6px; top: 15px;
            border-width: 6px 6px 6px 0;
            border-style: solid;
            border-color: transparent #fff transparent transparent;
        }

        .msg-bubble.right { background: #95ec69; }
        .msg-bubble.right::before {
            content: ''; position: absolute;
            right: -6px; top: 15px;
            border-width: 6px 0 6px 6px;
            border-style: solid;
            border-color: transparent transparent transparent #95ec69;
        }

        .msg-img {
            max-width: 150px;
            border-radius: 4px;
        }

        /* 输入框 */
        .chat-input-bar {
            height: 50px;
            background: #f2f2f7;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }
        .chat-input-bar input {
            flex: 1;
            height: 35px;
            border-radius: 5px;
            border: 1px solid #ccc;
            padding: 0 10px;
            outline: none;
            background: #fff;
        }

        /* 海边日出彩色画面 */
        #screen-sunrise {
            background: linear-gradient(to bottom, #ff7e5f, #feb47b, #ffeba7, #4facfe);
            display: none;
            justify-content: center;
            align-items: flex-end;
        }
        .silhouette {
            position: absolute;
            bottom: 50px; left: 50px;
            width: 100px; height: 150px;
            background: #111;
            clip-path: polygon(30% 100%, 40% 60%, 35% 20%, 50% 0%, 65% 20%, 60% 60%, 70% 100%);
        }
        .silhouette-2 {
            left: 160px;
            width: 90px; height: 140px;
            clip-path: polygon(20% 100%, 40% 50%, 30% 10%, 50% 0%, 70% 10%, 60% 50%, 80% 100%);
        }

        /* 结尾渐显 */
        .outro-item {
            display: block;
            margin: 0 auto 20px;
            max-width: 80%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        .outro-item.show {
            opacity: 1;
        }

        /* 彩蛋：鼠标悬停时的光标提示 */
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body>

    <!-- 横屏提示 -->
    <div id="rotate-notice">
        <p>请旋转手机，使用横屏模式体验</p>
        <p style="font-size:12px; margin-top:10px; color:#888;">建议全屏观看</p>
    </div>

    <!-- 背景音乐 (由用户交互后开始播放) -->
    <audio id="bgm" loop>
        <source src="*keepgoingon.mp3" type="audio/mpeg">
    </audio>
    <!-- 音频文件 -->
    <audio id="audio-houzuo">
        <source src="*houzuo.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio-zhkgo">
        <source src="*zhkgo.mp3" type="audio/mpeg">
    </audio>

    <div id="game-container">
        
        <!-- ================= 界面0: 主界面 ================= -->
        <div id="screen-main" class="screen active">
            <img src="*zhujiemian.jpg" class="bg-img comic-filter" alt="主界面">
            <!-- 抽屉热区 (靠下的位置) -->
            <div class="hotspot" id="hotspot-drawer" style="bottom: 5%; right: 10%; width: 30%; height: 20%;"></div>
            
            <!-- 隐藏的钥匙 -->
            <img src="*yaoshi.jpg" class="drawer-item img-highlight" id="hidden-key" 
                 style="bottom: 15%; left: 8%; width: 60px; opacity: 0.3; transform: rotate(15deg);" 
                 alt="钥匙">
                 
            <!-- 手机热区 (桌面) -->
            <div class="hotspot" id="hotspot-phone-main" style="top: 40%; left: 25%; width: 10%; height: 15%;"></div>
            
            <!-- 彩蛋热区 - 水杯 -->
            <div class="hotspot" id="easter-egg-cup" style="top: 20%; right: 25%; width: 5%; height: 10%;"></div>
        </div>

        <!-- ================= 界面1: 抽屉俯视 ================= -->
        <div id="screen-drawer" class="screen">
            <img src="*chouti.jpg" class="bg-img comic-filter" alt="抽屉">
            
            <!-- 空白点击区 -->
            <div class="hotspot" id="hotspot-drawer-bg" style="top: 0; left: 0; width: 100%; height: 100%;"></div>

            <!-- 抽屉物品不规则摆放 -->
            <img src="*shoutao (ct).jpg" class="drawer-item img-highlight" id="item-shoutao" 
                 style="top: 40%; left: 20%; width: 15%; transform: rotate(-20deg);" alt="手套">
                 
            <img src="*guajian (ct).jpg" class="drawer-item img-highlight" id="item-guajian" 
                 style="top: 60%; left: 45%; width: 15%; transform: rotate(10deg);" alt="挂件">
                 
            <img src="*erding (ct).jpg" class="drawer-item img-highlight" id="item-erding" 
                 style="top: 30%; left: 65%; width: 12%; transform: rotate(45deg);" alt="耳钉">

            <!-- 点击后展示的大图 -->
            <img src="*erding.jpg" class="item-display img-highlight" id="display-erding" alt="耳钉大图">
            <img src="*shoutao.jpg" class="item-display img-highlight" id="display-shoutao" alt="手套大图">
            <img src="*guajian.jpg" class="item-display img-highlight" id="display-guajian" alt="挂件大图">
        </div>

        <!-- ================= 界面5: 开门过程 ================= -->
        <div id="screen-door" class="screen">
            <img src="*men.jpg" class="bg-img comic-filter" id="door-img" alt="门">
        </div>

        <!-- ================= 黑屏与音频 ================= -->
        <div id="screen-black" class="screen" style="background: #000; z-index: 500;">
        </div>

        <!-- ================= 海边日出 (彩色) ================= -->
        <div id="screen-sunrise" class="screen">
            <div class="silhouette"></div>
            <div class="silhouette silhouette-2"></div>
        </div>

        <!-- ================= 结尾渐显 ================= -->
        <div id="screen-outro" class="screen" style="background: #000; z-index: 600; display: none; text-align: center; padding-top: 5%;">
            <img src="*21.jpg" class="outro-item" id="outro-21" style="max-height: 30vh;" alt="21">
            <div>
                <img src="*daizheai.jpg" class="outro-item" id="outro-daizheai" style="display: inline-block; max-height: 30vh; margin-right: 20px;" alt="带着爱">
                <img src="*kgo.jpg" class="outro-item" id="outro-kgo" style="display: inline-block; max-height: 30vh;" alt="kgo">
            </div>
        </div>

        <!-- ================= 手机 UI 弹窗 ================= -->
        <div id="phone-modal">
            <div class="phone-screen">
                <div class="phone-status-bar">
                    <span>9:41</span>
                    <span>📶 🔋</span>
                </div>
                
                <!-- 手机桌面 -->
                <div class="phone-home-screen" id="phone-home">
                    <div class="wechat-icon" id="wechat-app"></div>
                </div>

                <!-- 聊天界面 -->
                <div class="chat-ui" id="chat-ui">
                    <div class="chat-header">
                        <div class="back-btn" id="chat-back">‹</div>
                        <span id="chat-title">平安健康皆是福</span>
                    </div>
                    <div class="chat-content" id="chat-content">
                        <!-- 聊天记录动态插入 -->
                    </div>
                    <div class="chat-input-bar">
                        <input type="text" placeholder="发消息..." readonly>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ================= 基础逻辑 =================
        const gameContainer = document.getElementById('game-container');
        const screens = document.querySelectorAll('.screen');
        const bgm = document.getElementById('bgm');
        
        // 当前状态追踪
        let currentChatData = [];
        let chatTimeout = null;
        let currentScreen = 'screen-main';
        let chatTarget = ''; 

        // 星星特效
        document.addEventListener('click', function(e) {
            // 不拦截按钮点击的默认行为，但阻止冒泡可能影响的其他逻辑
            createStar(e.clientX, e.clientY);
        });

        function createStar(x, y) {
            const star = document.createElement('div');
            star.className = 'star-effect';
            star.innerHTML = '✨';
            // 相对定位计算
            const rect = gameContainer.getBoundingClientRect();
            star.style.left = (x - rect.left) + 'px';
            star.style.top = (y - rect.top) + 'px';
            gameContainer.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }

        // 页面切换
        function showScreen(id) {
            screens.forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            if (target) {
                target.classList.add('active');
                currentScreen = id;
            }
            // 如果在抽屉界面，隐藏大图
            if (id === 'screen-drawer') {
                document.querySelectorAll('.item-display').forEach(img => img.style.display = 'none');
            }
        }

        // 初始化，第一次点击开始背景音乐
        let bgmStarted = false;
        document.addEventListener('click', () => {
            if (!bgmStarted) {
                bgm.volume = 0.5;
                bgm.play().catch(e => console.log("BGM播放被拦截，等待用户交互"));
                bgmStarted = true;
            }
        }, { once: true });

        // ================= 主界面逻辑 =================
        // 点击抽屉
        document.getElementById('hotspot-drawer').addEventListener('click', (e) => {
            e.stopPropagation();
            showScreen('screen-drawer');
        });

        // 点击隐藏钥匙 (只是展示，可能有一点点提示)
        document.getElementById('hidden-key').addEventListener('click', (e) => {
            e.stopPropagation();
            createStar(e.clientX, e.clientY);
        });

        // 点击主界面手机
        document.getElementById('hotspot-phone-main').addEventListener('click', (e) => {
            e.stopPropagation();
            openPhone('eagle');
        });

        // 彩蛋点击水杯
        document.getElementById('easter-egg-cup').addEventListener('click', (e) => {
            e.stopPropagation();
            createStar(e.clientX, e.clientY);
            alert('（纸团弹了一下）');
        });

        // ================= 抽屉逻辑 =================
        document.getElementById('hotspot-drawer-bg').addEventListener('click', (e) => {
            if (e.target.id === 'hotspot-drawer-bg') {
                showScreen('screen-main');
            }
        });

        // 点击物品
        document.getElementById('item-erding').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('display-erding').style.display = 'block';
            document.getElementById('display-shoutao').style.display = 'none';
            document.getElementById('display-guajian').style.display = 'none';
        });

        document.getElementById('item-shoutao').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('display-shoutao').style.display = 'block';
            document.getElementById('display-erding').style.display = 'none';
            document.getElementById('display-guajian').style.display = 'none';
        });

        document.getElementById('item-guajian').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('display-guajian').style.display = 'block';
            document.getElementById('display-erding').style.display = 'none';
            document.getElementById('display-shoutao').style.display = 'none';
        });

        // 点击大图进入手机
        document.getElementById('display-erding').addEventListener('click', (e) => {
            e.stopPropagation();
            openPhone('zuohang_erding');
        });
        document.getElementById('display-shoutao').addEventListener('click', (e) => {
            e.stopPropagation();
            openPhone('zuohang_shoutao');
        });
        document.getElementById('display-guajian').addEventListener('click', (e) => {
            e.stopPropagation();
            openPhone('zuohang_guajian');
        });

        // ================= 手机 UI 逻辑 =================
        const phoneModal = document.getElementById('phone-modal');
        const phoneHome = document.getElementById('phone-home');
        const chatUI = document.getElementById('chat-ui');
        const chatContent = document.getElementById('chat-content');
        const chatTitle = document.getElementById('chat-title');
        const wechatApp = document.getElementById('wechat-app');
        const chatBack = document.getElementById('chat-back');

        function openPhone(chatType) {
            phoneModal.style.display = 'block';
            phoneHome.style.display = 'flex';
            chatUI.style.display = 'none';
            chatTarget = chatType;
        }

        function closePhone() {
            phoneModal.style.display = 'none';
            chatContent.innerHTML = '';
            if(chatTimeout) clearTimeout(chatTimeout);
        }

        // 点击微信图标
        wechatApp.addEventListener('click', () => {
            phoneHome.style.display = 'none';
            chatUI.style.display = 'flex';
            chatContent.innerHTML = '';
            
            if (chatTarget === 'eagle') {
                startEagleChat();
            } else if (chatTarget === 'zuohang_erding') {
                startZuohangChat('erding');
            } else if (chatTarget === 'zuohang_shoutao') {
                startZuohangChat('shoutao');
            } else if (chatTarget === 'zuohang_guajian') {
                startZuohangChat('guajian');
            }
        });

        chatBack.addEventListener('click', () => {
            if(chatTimeout) clearTimeout(chatTimeout);
            closePhone();
            if (chatTarget === 'zuohang_erding' || chatTarget === 'zuohang_shoutao' || chatTarget === 'zuohang_guajian') {
                // 如果是看物品的聊天，返回抽屉
                showScreen('screen-drawer');
            } else if (chatTarget === 'eagle') {
                // 如果是群聊，进入开门剧情
                startDoorSequence();
            }
        });

        // 聊天数据与动画
        function renderChatMsg(msg, isRight, avatarUrl, isImage = false) {
            const row = document.createElement('div');
            row.className = `msg-row ${isRight ? 'right' : ''}`;
            
            const avatar = document.createElement('img');
            avatar.className = 'avatar';
            avatar.src = avatarUrl;
            
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${isRight ? 'right' : 'left'}`;
            
            if (isImage) {
                const img = document.createElement('img');
                img.className = 'msg-img';
                img.src = msg;
                bubble.appendChild(img);
            } else {
                bubble.textContent = msg;
            }
            
            row.appendChild(avatar);
            row.appendChild(bubble);
            chatContent.appendChild(row);
            chatContent.scrollTop = chatContent.scrollHeight;
        }

        // 左航聊天 (包含耳钉、手套、挂件)
        function startZuohangChat(type) {
            chatTitle.textContent = '平安健康皆是福';
            const zzxAvatar = '*zzxtouxiang.jpg';
            const zhAvatar = '*zhtouxiang.jpg';
            
            let msgs = [];
            if (type === 'erding') {
                msgs = [
                    { text: '*erdingzzx.jpg', isRight: true, isImg: true },
                    { text: '喜欢', isRight: true },
                    { text: '但是你怎么想起来给我买克罗心了？', isRight: true },
                    { text: '*erdingzh.jpg', isRight: false, isImg: true },
                    { text: '一人一只', isRight: false },
                    { text: '左航好像喜欢朱志鑫', isRight: true },
                    { text: '可以把好像去掉', isRight: false }
                ];
            } else if (type === 'shoutao') {
                msgs = [
                    { text: '怎么还在给我买礼物？', isRight: true },
                    { text: '*shoutaozzx.jpg', isRight: true, isImg: true },
                    { text: '觉得你会喜欢就买了', isRight: false },
                    { text: '这把有感觉', isRight: false },
                    { text: '左航', isRight: true },
                    { text: '今年跟我一块过年吧', isRight: true },
                    { text: '我带你去滑雪', isRight: true },
                    { text: '考虑！', isRight: false }
                ];
            } else if (type === 'guajian') {
                msgs = [
                    { text: '*guajian.jpg', isRight: true, isImg: true },
                    { text: '这是我俩吗？', isRight: true },
                    { text: '对啊', isRight: false },
                    { text: '和我的兄弟们全部都坐上了DD BACKSEAT', isRight: false },
                    { text: '你咋还有空去拼豆', isRight: true },
                    { text: '以为谁都跟你一样天天在家打游戏啊', isRight: false },
                    { text: '对了，说到游戏。', isRight: true },
                    { text: '上号。', isRight: true }
                ];
            }

            let i = 0;
            function showNext() {
                if (i >= msgs.length) return;
                const m = msgs[i];
                renderChatMsg(m.text, m.isRight, m.isRight ? zzxAvatar : zhAvatar, m.isImg);
                i++;
                chatTimeout = setTimeout(showNext, m.isImg ? 1500 : 1000);
            }
            showNext();
        }

        // 群聊 Eagle
        function startEagleChat() {
            chatTitle.textContent = 'eagle';
            const avatars = {
                zzx: '*zzxtouxiang.jpg',
                zh: '*zhtouxiang.jpg',
                zzy: '*zzytouxiang.jpg',
                zj: '*zjtouxiang.jpg',
                sxh: '*sxhtouxiang.jpg'
            };
            
            const msgs = [
                { name: '张泽禹', id: 'zzy', text: '左航出去骑车了？', isRight: false },
                { name: '张极', id: 'zj', text: '你怎么知道？', isRight: false },
                { name: '苏新皓', id: 'sxh', text: '应该是听到声音了吧！', isRight: false },
                { name: '苏新皓', id: 'sxh', text: '我也听到了的！', isRight: false },
                { name: '朱志鑫', id: 'zzx', text: '怎么可能。', isRight: true },
                { name: '朱志鑫', id: 'zzx', text: '他车钥匙在我这儿啊！', isRight: true }
            ];

            let i = 0;
            function showNext() {
                if (i >= msgs.length) {
                    // 群聊结束，弹窗左航私聊
                    chatTimeout = setTimeout(() => {
                        chatTitle.textContent = '平安健康皆是福';
                        chatContent.innerHTML = '';
                        renderChatMsg('小区门口等你。', false, avatars.zh);
                        // 显示完这句后自动关闭手机进入开门
                        chatTimeout = setTimeout(() => {
                            closePhone();
                            startDoorSequence();
                        }, 2000);
                    }, 1000);
                    return;
                }
                const m = msgs[i];
                renderChatMsg(m.text, m.isRight, avatars[m.id]);
                i++;
                chatTimeout = setTimeout(showNext, 1200);
            }
            showNext();
        }

        // ================= 剧情开门与音频 =================
        function startDoorSequence() {
            showScreen('screen-door');
            document.getElementById('door-img').src = '*men.jpg';
            
            // 点击屏幕切换开门
            const doorImg = document.getElementById('door-img');
            const handleDoorClick = () => {
                doorImg.src = '*kaimen.jpg';
                doorImg.removeEventListener('click', handleDoorClick);
                doorImg.addEventListener('click', handleEnterBlack);
            };
            doorImg.addEventListener('click', handleDoorClick);
            
            function handleEnterBlack(e) {
                e.stopPropagation();
                doorImg.removeEventListener('click', handleEnterBlack);
                showScreen('screen-black');
                
                // 播放音频1
                const audioHouzuo = document.getElementById('audio-houzuo');
                audioHouzuo.play();
                audioHouzuo.onended = () => {
                    // 播放结束，显示日出
                    showScreen('screen-sunrise');
                    
                    // 播放音频2
                    const audioZhkgo = document.getElementById('audio-zhkgo');
                    audioZhkgo.play();
                    audioZhkgo.onended = () => {
                        // 播放结束，变黑
                        showScreen('screen-black');
                        // 延迟后渐显结尾
                        setTimeout(() => {
                            showScreen('screen-outro');
                            const outroScreen = document.getElementById('screen-outro');
                            outroScreen.style.display = 'block';
                            
                            // 渐显动画
                            setTimeout(() => {
                                document.getElementById('outro-21').classList.add('show');
                            }, 500);
                            setTimeout(() => {
                                document.getElementById('outro-daizheai').classList.add('show');
                            }, 1500);
                            setTimeout(() => {
                                document.getElementById('outro-kgo').classList.add('show');
                            }, 2500);
                            
                        }, 1000);
                    };
                };
            }
        }

        // 阻止点击空白关闭手机等误操作 (为了流程稳定)
        phoneModal.addEventListener('click', (e) => {
            e.stopPropagation(); // 阻止星星特效在手机上触发
        });

    </script>
</body>
</html>
